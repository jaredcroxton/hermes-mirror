<style>
/* ============ tokens ============ */
:root {
  /* theme tokens: overwritten live by the theme chips (JS applies the preset) */
  --bg:#F7F3EC; --ink:#201B14; --ink2:#57503F; --accent:#8A5800; --accent-deep:#5F3D00;
  --card:#FFFFFF; --line:#E2DACB;
  --font-head:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  /* fixed instrument palette: drawer, edit sidebar, activity overlay, remote (never themed) */
  --inst-bg:#16181D; --inst-panel:#1D2026; --inst-ink:#E9E5DC; --inst-ink2:#A39D91;
  --inst-amber:#F5A623; --inst-teal:#39B8A8; --inst-red:#E5484D; --inst-line:#2C2F36;
  /* type system: fluid via clamp, never fixed px on the deck (web-standards Type 1) */
  --display:clamp(3.5rem, 8vw, 7.5rem);
  --headline:clamp(2rem, 4vw, 3.25rem);
  --body:clamp(1.125rem, 0.95rem + 0.5vw, 1.5rem);
  --meta:0.8rem;
  /* motion tokens (web-standards Motion 2); named properties only, never transition: all */
  --ease-out-quart:cubic-bezier(0.25, 1, 0.5, 1);
  --ease-in-out-quad:cubic-bezier(0.45, 0, 0.55, 1);
  --t-reveal:560ms; --t-micro:160ms;
  --drawerw:470px; /* plain px only; the 94vw cap lives in each width rule (scar 1) */
}
@media (prefers-reduced-motion: reduce) {
  :root { --t-reveal:0ms; --t-micro:0ms; }
}
/* ============ base ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:var(--body); line-height:1.6;
  overflow:hidden;
}
::selection { background:color-mix(in oklch, var(--accent) 25%, var(--bg)); color:var(--ink); }
h1,h2,h3,h4 { text-wrap:balance; }
p, li { text-wrap:pretty; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
.vh { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.skip {
  position:fixed; left:8px; top:-56px; z-index:99;
  background:var(--card); color:var(--ink); padding:10px 16px;
  border:1px solid var(--line); border-radius:6px;
  transition:top var(--t-micro) var(--ease-out-quart);
}
.skip:focus { top:8px; }
.tabular { font-variant-numeric:tabular-nums; }
/* ============ app + stage ============ */
#app { position:fixed; inset:0; display:flex; flex-direction:column; }
#app.cursor-hide, #app.cursor-hide * { cursor:none; } /* audience stagecraft: idle cursor never parks on the wall */
#stage {
  flex:1; display:flex; align-items:flex-start; /* never center + overflow (scar 8) */
  overflow:auto; scrollbar-width:thin;
  padding:clamp(24px, 5vh, 64px) clamp(20px, 7vw, 120px);
  padding-bottom:calc(clamp(24px, 5vh, 64px) + env(safe-area-inset-bottom));
}
#stage > .inner { margin:auto; width:100%; max-width:1080px; } /* centres short, scrolls tall (scar 8) */
@media (min-width:900px) {
  body.editing:not(.edit-tucked) #app { padding-left:430px; } /* edit reflows the step, never covers it */
}
/* reveal primitive: transform and opacity only (web-standards Motion 1, Motion 5) */
.reveal { opacity:0; transform:translateY(18px); }
.reveal.in {
  opacity:1; transform:none;
  transition:opacity var(--t-reveal) var(--ease-out-quart), transform var(--t-reveal) var(--ease-out-quart);
}
/* ============ opener (plain typographic, the default) ============ */
.opener { text-align:left; padding:2vh 0; }
.opener .eyebrow {
  font-size:var(--meta); letter-spacing:0.10em; text-transform:uppercase;
  color:var(--ink2); margin-bottom:1.2rem; font-family:var(--font-mono);
}
.opener .stage-name {
  font-family:var(--font-head); font-size:var(--display);
  line-height:1.05; letter-spacing:var(--track-display, -0.02em);
  font-weight:600; margin-bottom:1rem;
}
.opener .rule { width:72px; height:4px; background:var(--accent); margin:0 0 1.6rem; }
.opener .sub { font-size:1.15em; max-width:65ch; color:var(--ink); margin-bottom:0.5rem; font-weight:600; }
.opener .sum { max-width:65ch; color:var(--ink2); margin-bottom:2rem; }
.opener .objectives { list-style:none; max-width:65ch; }
.opener .objectives li {
  padding:0.55rem 0 0.55rem 1.1rem; border-left:3px solid var(--accent);
  margin-bottom:0.6rem; color:var(--ink);
}
.opener .op-meta { margin-top:2.4rem; font-family:var(--font-mono); font-size:var(--meta); color:var(--ink2); }
/* cinematic opener overlay: the ONLY canvas and the ONLY rAF loop in the build */
#cine {
  position:fixed; inset:0; z-index:60; background:#16181D; display:flex;
  align-items:center; justify-content:center;
}
#cine canvas { position:absolute; inset:0; width:100%; height:100%; }
#cine .cine-title {
  position:relative; z-index:2; color:#F5A623; font-family:var(--font-head);
  font-size:var(--display); letter-spacing:-0.02em; text-shadow:0 2px 24px rgba(0,0,0,0.6);
}
#cine .cine-skip {
  position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); right:24px; z-index:2;
  color:#E9E5DC; font-family:var(--font-mono); font-size:0.8rem; opacity:0.7;
}
/* ============ step ============ */
.step .seg {
  font-size:var(--meta); letter-spacing:0.10em; text-transform:uppercase;
  color:var(--ink2); font-family:var(--font-mono); margin-bottom:1.6rem;
}
.tilewrap { position:relative; margin-bottom:1.4rem; } /* edit chrome attaches HERE, never inside the editable (scar 9) */
.b-heading {
  font-family:var(--font-head); font-size:var(--headline); line-height:1.12;
  letter-spacing:-0.01em; font-weight:600; padding-bottom:0.5rem; display:inline-block;
  border-bottom:4px solid var(--accent);
}
.b-text { max-width:65ch; color:var(--ink); }
.b-script { display:none; }
.b-script.onwall {
  display:block; max-width:65ch; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--accent); padding:1.1rem 1.4rem; border-radius:6px;
}
.b-script.onwall .script-tag {
  font-family:var(--font-mono); font-size:var(--meta); letter-spacing:0.10em;
  text-transform:uppercase; color:var(--accent); display:block; margin-bottom:0.4rem;
}
.b-discussion {
  max-width:34ch; border-left:6px solid var(--accent); padding:0.6rem 0 0.6rem 1.4rem;
  font-family:var(--font-head); font-size:clamp(1.6rem, 3vw, 2.6rem); line-height:1.2;
  letter-spacing:-0.005em; font-weight:600;
}
.b-wb .wb-prompt, .b-poll .poll-prompt { font-weight:600; margin-bottom:0.7rem; max-width:65ch; }
.b-wb ul { list-style:none; max-width:65ch; }
.b-wb li {
  padding:0.5rem 0.9rem; background:var(--card); border:1px solid var(--line);
  border-radius:6px; margin-bottom:0.5rem;
  opacity:1; transform:none;
  transition:opacity var(--t-micro) var(--ease-out-quart), transform var(--t-micro) var(--ease-out-quart);
}
.b-wb li.enter { opacity:0; transform:translateY(8px); } /* the appended node animates, never the list (scar 7) */
.b-wb input {
  margin-top:0.5rem; width:100%; max-width:65ch; padding:0.7rem 0.9rem;
  font:inherit; color:var(--ink); background:var(--card);
  border:1px dashed var(--line); border-radius:6px;
}
body.role-audience .b-wb input { display:none; } /* audience is read-only */
.poll-row { display:grid; grid-template-columns:minmax(10ch, 22ch) 1fr auto auto; gap:0.7rem; align-items:center; max-width:65ch; margin-bottom:0.55rem; }
.poll-track { height:14px; background:var(--line); border-radius:7px; overflow:hidden; }
.poll-fill {
  height:100%; background:var(--accent); border-radius:7px;
  transform-origin:left; transform:scaleX(var(--p, 0)); /* scaleX, never width: layout never animates */
  transition:transform var(--t-micro) var(--ease-in-out-quad);
}
.poll-count { font-family:var(--font-mono); font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; }
.poll-btns button {
  min-width:44px; min-height:44px; border:1px solid var(--line); border-radius:6px;
  background:var(--card); font-size:1.1rem;
  transition:background var(--t-micro) var(--ease-out-quart);
}
.poll-btns button:hover { background:color-mix(in oklch, var(--accent) 12%, var(--card)); }
.poll-btns button:active { transform:translateY(1px); }
body.role-audience .poll-btns, body.editing .poll-btns { display:none; } /* presenter counts hands, outside edit mode */
.b-media { max-width:760px; }
.b-media img, .b-media video, .b-media iframe {
  width:100%; max-width:100%; border-radius:8px; border:1px solid var(--line); display:block;
  aspect-ratio:16/9; object-fit:cover; background:var(--card);
}
.b-media .cap { font-size:var(--meta); color:var(--ink2); margin-top:0.5rem; font-family:var(--font-mono); }
.b-media .pending {
  border:2px dashed var(--line); border-radius:8px; aspect-ratio:16/9;
  display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--ink2); padding:1rem; font-size:0.95rem;
}
.b-split { display:grid; grid-template-columns:1fr 1fr; gap:1.6rem; align-items:start; }
@media (max-width:820px) { .b-split { grid-template-columns:1fr; } }
.b-split .b-script { display:block; } /* inside a split the script is the point: always on the wall */
.wb-cue {
  display:inline-block; margin-top:0.8rem; font-family:var(--font-mono); font-size:var(--meta);
  color:var(--accent-deep); border:1px solid var(--line); border-radius:99px; padding:0.35rem 0.9rem;
  background:var(--card);
}
/* ============ deck chrome ============ */
.chrome-btn {
  position:fixed; top:50%; transform:translateY(-50%); z-index:20;
  font-size:2rem; line-height:1; color:color-mix(in oklch, var(--ink) 32%, var(--bg));
  min-width:44px; min-height:44px; border-radius:8px;
  transition:color var(--t-micro) var(--ease-out-quart), background var(--t-micro) var(--ease-out-quart);
}
.chrome-btn:hover { color:var(--accent); }
.chrome-btn:disabled { opacity:0.35; cursor:not-allowed; }
#prevBtn { left:12px; }
#nextBtn { right:12px; }
body.drawer-open #nextBtn { right:calc(min(var(--drawerw), 94vw) + 12px); } /* dependent chrome shares the width expression */
#nextBtn.advance {
  font-size:0.95rem; font-weight:600; font-family:var(--font-body);
  background:var(--accent); color:var(--bg); padding:0.7rem 1.2rem; border-radius:99px;
}
#dots { position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:20; }
#dots i { width:8px; height:8px; border-radius:50%; background:color-mix(in oklch, var(--ink) 25%, var(--bg)); }
#dots i.on { background:var(--accent); }
#meta {
  position:fixed; bottom:calc(12px + env(safe-area-inset-bottom)); left:16px; z-index:20;
  font-family:var(--font-mono); font-size:var(--meta); color:var(--ink2);
}
body.role-audience .chrome-btn, body.role-audience #dots { display:none; } /* the stage has no controls */
#fsBtn {
  position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:30;
  background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:0.6rem 1rem; font-size:0.9rem; color:var(--ink2);
}
/* ============ presenter drawer (fixed dark instrument palette) ============ */
#drawer {
  position:fixed; top:0; right:0; bottom:0; z-index:40;
  width:min(var(--drawerw), 94vw); /* the cap lives HERE, never in the var (scar 1) */
  background:var(--inst-bg); color:var(--inst-ink);
  -webkit-font-smoothing:antialiased;
  transform:translateX(100%);
  transition:transform 240ms var(--ease-in-out-quad); /* transform only; width changes SNAP (scar 1) */
  display:flex; flex-direction:column; font-size:16px; line-height:1.5;
}
body.drawer-open #drawer { transform:none; }
#drawer .grip {
  position:absolute; left:0; top:0; bottom:0; width:10px; cursor:ew-resize;
  background:var(--inst-amber); opacity:0.85;
}
#drawer .scroll { flex:1; overflow-y:auto; scrollbar-width:thin; padding:18px 18px 18px 26px; }
#drawer .scroll::-webkit-scrollbar { width:8px; }
#drawer .scroll::-webkit-scrollbar-thumb { background:var(--inst-line); border-radius:4px; }
#drawer h3 {
  font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--inst-ink2); margin:18px 0 8px;
}
#drawer .notes p { margin-bottom:8px; font-size:16px; }
#drawer .notes .k { color:var(--inst-amber); font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; margin-right:6px; }
#drawer .notes .mins { color:var(--inst-ink2); font-size:14.5px; }
#drawer .clocks { display:flex; gap:18px; font-variant-numeric:tabular-nums; font-family:var(--font-mono); }
#drawer .clocks .over { color:var(--inst-red); }
#drawer .cutline {
  margin-top:8px; padding:8px 10px; border-left:3px solid var(--inst-red);
  background:var(--inst-panel); color:var(--inst-ink); font-size:14.5px; border-radius:4px;
}
#drawer .scriptrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; font-size:14.5px; color:var(--inst-ink2); }
#drawer .scriptrow button {
  border:1px solid var(--inst-line); border-radius:6px; padding:4px 10px; color:var(--inst-ink);
  font-size:13px; min-height:32px;
  transition:background var(--t-micro) var(--ease-out-quart);
}
#drawer .scriptrow button.on { background:var(--inst-amber); color:var(--inst-bg); border-color:var(--inst-amber); }
#drawer .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
#drawer .grid button {
  border:1px solid var(--inst-line); background:var(--inst-panel); color:var(--inst-ink);
  border-radius:8px; padding:10px 8px; font-size:14px; min-height:44px; text-align:center;
  transition:background var(--t-micro) var(--ease-out-quart), border-color var(--t-micro) var(--ease-out-quart);
}
#drawer .grid button:hover { border-color:var(--inst-amber); }
#drawer .grid button:active { transform:translateY(1px); }
#drawer .grid button.primary { background:var(--inst-amber); color:var(--inst-bg); border-color:var(--inst-amber); font-weight:600; }
#drawer .grid button.done { background:var(--inst-teal); color:var(--inst-bg); border-color:var(--inst-teal); }
#drawer .grid button.danger { border-color:var(--inst-red); color:var(--inst-red); }
#drawer .grid button:disabled { opacity:0.4; cursor:not-allowed; }
#drawer .chips { display:flex; gap:8px; flex-wrap:wrap; }
#drawer .chips button {
  border:1px solid var(--inst-line); border-radius:99px; padding:6px 12px; font-size:13px;
  color:var(--inst-ink); min-height:32px;
}
#drawer .chips button.on { border-color:var(--inst-amber); color:var(--inst-amber); }
#drawer .remoterow { font-size:13px; color:var(--inst-ink2); word-break:break-all; }
#drawer .remoterow img { margin-top:6px; border-radius:6px; background:#fff; padding:4px; }
#drawer .keys { font-family:var(--font-mono); font-size:12px; color:var(--inst-ink2); margin-top:14px; }
#drawer .nextprev { font-size:14.5px; color:var(--inst-ink2); }
/* ============ edit mode (teal instrument, left) ============ */
#editBanner {
  position:fixed; top:0; left:0; right:0; z-index:55; display:none;
  background:var(--inst-teal); color:var(--inst-bg); font-family:var(--font-mono);
  font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase; padding:6px 14px;
}
body.editing #editBanner { display:block; }
#editbar {
  position:fixed; top:0; left:0; bottom:0; z-index:50; width:430px; max-width:94vw;
  background:var(--inst-bg); color:var(--inst-ink); border-right:2px solid var(--inst-teal);
  -webkit-font-smoothing:antialiased;
  transform:translateX(-100%); transition:transform 240ms var(--ease-in-out-quad);
  display:flex; flex-direction:column; font-size:14px;
}
body.editing:not(.edit-tucked) #editbar { transform:none; }
#editTab {
  position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:51; display:none;
  background:var(--inst-teal); color:var(--inst-bg); padding:12px 8px; border-radius:0 8px 8px 0;
  font-family:var(--font-mono); font-size:12px; writing-mode:vertical-rl; min-height:56px;
}
body.editing.edit-tucked #editTab { display:block; }
#editbar .ebscroll { flex:1; overflow-y:auto; scrollbar-width:thin; padding:44px 16px 16px; }
#editbar .ebscroll::-webkit-scrollbar { width:8px; }
#editbar .ebscroll::-webkit-scrollbar-thumb { background:var(--inst-line); border-radius:4px; }
#editbar h3 { font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--inst-teal); margin:16px 0 8px; }
#editbar .tree button { display:block; width:100%; text-align:left; padding:6px 8px; border-radius:6px; color:var(--inst-ink2); font-size:13.5px; min-height:32px; }
#editbar .tree button.cur { background:var(--inst-panel); color:var(--inst-ink); }
#editbar .tree .mod { color:var(--inst-ink); font-weight:600; }
#editbar .ops { display:flex; gap:6px; flex-wrap:wrap; }
#editbar .ops button, #editbar .rowbtn {
  border:1px solid var(--inst-line); border-radius:6px; padding:6px 10px; color:var(--inst-ink);
  font-size:12.5px; min-height:32px;
}
#editbar textarea, #editbar input[type=text], #editbar select {
  width:100%; background:var(--inst-panel); color:var(--inst-ink); border:1px solid var(--inst-line);
  border-radius:6px; padding:8px; font:inherit; font-size:13.5px; margin:4px 0 10px;
}
#editbar textarea { min-height:64px; resize:vertical; }
#editCollapse {
  position:absolute; right:-2px; top:50%; transform:translate(100%, -50%); z-index:51;
  background:var(--inst-teal); color:var(--inst-bg); padding:12px 6px; border-radius:0 8px 8px 0;
  font-family:var(--font-mono); font-size:12px; writing-mode:vertical-rl; min-height:56px;
}
[data-edit] { border-radius:4px; }
body.editing [data-edit] { cursor:text; outline:1px dashed color-mix(in oklch, var(--inst-teal) 45%, transparent); outline-offset:3px; }
[data-edit].editing-el { outline:2px solid var(--inst-teal) !important; outline-offset:3px; }
.xchip {
  position:absolute; top:-10px; right:-10px; z-index:5; display:none;
  width:26px; height:26px; border-radius:50%; background:var(--inst-red); color:#fff;
  font-size:14px; line-height:26px; text-align:center;
}
body.editing .xchip { display:block; }
body.role-audience .xchip { display:none !important; }
#addTile {
  display:none; margin:6px 0 20px; border:2px dashed var(--line); border-radius:8px;
  padding:10px 16px; color:var(--ink2); width:100%; max-width:65ch; text-align:center;
  transition:border-color var(--t-micro) var(--ease-out-quart);
}
#addTile:hover { border-color:var(--accent); }
body.editing #addTile { display:block; }
#tileMenu {
  position:fixed; z-index:70; background:var(--inst-bg); color:var(--inst-ink);
  border:1px solid var(--inst-line); border-radius:10px; padding:8px; display:none;
  -webkit-font-smoothing:antialiased;
}
#tileMenu button { display:block; width:100%; text-align:left; padding:8px 14px; border-radius:6px; font-size:14px; min-height:36px; }
#tileMenu button:hover { background:var(--inst-panel); }
/* ============ overlays ============ */
.overlay {

<script>
(() => {
'use strict';
/* ============ constants and boot flags ============ */
const BUILD = 'ref-1.0.0';
const OPENER_SECONDS = 5;
const qsp = new URLSearchParams(location.search);
const ROLE = qsp.get('role') || 'solo';                 // solo | presenter | audience | remote
const PREVIEW = qsp.has('preview');
const REHEARSE = qsp.has('rehearse');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches || qsp.has('reduced-motion');
const NO_PERSIST = PREVIEW || REHEARSE;                 // session state never writes under preview or rehearse
const HTTPISH = location.protocol.startsWith('http');
const AUDIENCE = ROLE === 'audience';
const PRESENTER_SURFACE = ROLE === 'solo' || ROLE === 'presenter';

const THEMES = {
  /* every ink/ground pair measured against the contrast floor: body 7:1, accents 4.5:1 */
  'ink-amber':     { bg:'#F7F3EC', ink:'#201B14', ink2:'#57503F', accent:'#8A5800', accentDeep:'#5F3D00', card:'#FFFFFF', line:'#E2DACB',
                     head:'"Barlow Condensed","Arial Narrow",sans-serif', body:'"Barlow",system-ui,sans-serif', mono:'"JetBrains Mono",ui-monospace,monospace',
                     trackDisplay:'0em', plainOpener:false },
  'slate-minimal': { bg:'#FAFBFC', ink:'#16202A', ink2:'#46525E', accent:'#2456A6', accentDeep:'#183C77', card:'#FFFFFF', line:'#DFE5EA',
                     head:'system-ui,-apple-system,sans-serif', body:'system-ui,-apple-system,sans-serif', mono:'ui-monospace,SFMono-Regular,monospace',
                     trackDisplay:'-0.02em', plainOpener:false },
  'warm-serif':    { bg:'#FBF6EF', ink:'#241C14', ink2:'#5A4D3F', accent:'#8C4A21', accentDeep:'#6B3717', card:'#FFFFFF', line:'#EADFCF',
                     head:'Georgia,"Times New Roman",serif', body:'Georgia,"Times New Roman",serif', mono:'ui-monospace,SFMono-Regular,monospace',
                     trackDisplay:'-0.01em', plainOpener:false },
  'bold-brutal':   { bg:'#FFFFFF', ink:'#000000', ink2:'#3D3D3D', accent:'#C8102E', accentDeep:'#8F0B21', card:'#F4F4F4', line:'#D8D8D8',
                     head:'"Arial Black",Arial,sans-serif', body:'Arial,Helvetica,sans-serif', mono:'"Courier New",monospace',
                     trackDisplay:'0em', plainOpener:true }
};

/* ============ state ============ */
let course = null, slug = '';
let pos = { m: 0, s: -1 };            // s === -1 means the module opener
let advanced = 0;                     // highest unlocked module index
let completion = {};                  // moduleIdx -> checkpoint done
let openersPlayed = {};               // moduleIdx -> played this unlock
let scriptWall = {};                  // stepId:blockIdx -> on the wall
let whiteboards = {};                 // stepId -> [entries]
let polls = {};                       // stepId:blockIdx -> [counts]
let timeLog = {};                     // stepId -> actual seconds
let activity = { on:false };
let sessionId = '', sessionStart = Date.now();
let stepEntered = Date.now();
let editing = false;
let cineActive = false;
let wakeSentinel = null;

const $ = sel => document.querySelector(sel);
const K = name => slug + '_v1_' + name;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const load = (key, fallback) => { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } };
const store = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };
const curMod = () => course.modules[pos.m];
const curStep = () => pos.s === -1 ? null : curMod().steps[pos.s];
const mmss = secs => { const s = Math.max(0, Math.round(secs)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const planMinutes = step => (step.presenterNotes || []).reduce((a, n) => a + (Number(n.minutes) || 0), 0);

/* ============ boot: localStorage course wins, else inline seed, else fetch ============ */
async function boot() {
  let seed = null;
  const seedEl = document.getElementById('courseData');
  if (seedEl && seedEl.textContent.trim()) { try { seed = JSON.parse(seedEl.textContent); } catch {} }
  if (!seed && HTTPISH) { try { seed = await (await fetch('course.json')).json(); } catch {} }
  if (!seed) { document.body.textContent = 'No course found: no localStorage key, no inline seed, no course.json.'; return; }
  slug = seed.programme.slug;
  course = load(K('course'), null) || seed;   // the seed only fills an absent key: edits survive redeploys
  init();
}

/* ============ init ============ */
function init() {
  document.body.classList.add('role-' + ROLE);
  $('#progTitle').textContent = course.programme.title;
  $('#buildTag').textContent = BUILD;
  applyTheme((course.programme.brand && course.programme.brand.themePreset) || 'ink-amber', false);

  sessionId = load(K('session'), '');
  if (!sessionId) { sessionId = 's' + Date.now().toString(36); if (!NO_PERSIST) store(K('session'), sessionId); }
  sessionStart = load(K('sessionstart'), 0) || Date.now();
  if (!NO_PERSIST) store(K('sessionstart'), sessionStart);

  advanced = load(K('advancement'), 0);
  completion = load(K('completion'), {});
  openersPlayed = load(K('openers'), {});
  pos = load(K('position'), { m: 0, s: -1 });
  whiteboards = load(K('notes_' + sessionId), {});
  polls = load(K('polls_' + sessionId), {});
  timeLog = load(K('timelog_' + sessionId), {});
  const dw = load(K('drawerw'), 0); if (dw) document.documentElement.style.setProperty('--drawerw', dw + 'px');

  if (PREVIEW || REHEARSE) { advanced = course.modules.length - 1; pos = { m: 0, s: -1 }; }
  if (REHEARSE) { document.body.classList.add('rehearsing'); timeLog = {}; sessionStart = Date.now(); }
  const goto = qsp.get('goto');
  if (goto) {
    let [gm, gs] = goto.split(',').map(Number);
    gm = Math.min(Math.max(gm || 0, 0), course.modules.length - 1);
    if (!PREVIEW && !REHEARSE) gm = Math.min(gm, advanced);   // ?goto clamps to the frontier (scar 13)
    gs = Math.min(Math.max(isNaN(gs) ? -1 : gs, -1), course.modules[gm].steps.length - 1);
    pos = { m: gm, s: gs };
  }
  pos.m = Math.min(pos.m, course.modules.length - 1);
  pos.s = Math.min(pos.s, curMod().steps.length - 1);

  if (ROLE === 'remote') { initRemote(); return; }
  if (ROLE === 'presenter') document.body.classList.add('drawer-open');

  initChannel();
  initKeys();
  initSwipe();
  initEditDelegation();
  initGrip();
  initRelay();
  initStagecraft();
  if (qsp.get('edit') === '1') toggleEdit(true, qsp.get('tuck') === '1');

  window.addEventListener('beforeprint', buildPrintDoc);
  window.addEventListener('beforeunload', logDeparture);
  setInterval(tickClocks, 1000);

  render();
  if (AUDIENCE) postMsg('HELLO', {});   // the joining tab asks, the presenter answers with SYNC
}

/* ============ theming ============ */
let currentTheme = 'ink-amber';
function applyTheme(name, persist) {
  const t = THEMES[name] || THEMES['ink-amber'];
  currentTheme = THEMES[name] ? name : 'ink-amber';
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--ink', t.ink); r.setProperty('--ink2', t.ink2);
  r.setProperty('--accent', t.accent); r.setProperty('--accent-deep', t.accentDeep);
  r.setProperty('--card', t.card); r.setProperty('--line', t.line);
  r.setProperty('--font-head', t.head); r.setProperty('--font-body', t.body); r.setProperty('--font-mono', t.mono);
  r.setProperty('--track-display', t.trackDisplay);
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', t.bg);
  if (persist) {
    course.programme.brand = course.programme.brand || {};
    course.programme.brand.themePreset = currentTheme;
    commitCourse();
  }
  if (course && ROLE !== 'remote') { renderDrawer(); }
}

/* ============ channel sync (same machine, two tabs) ============ */
let chan = null;
function initChannel() {
  if (!('BroadcastChannel' in window)) return;
  chan = new BroadcastChannel(slug + '_v1_present');   // never crosses devices; the remote needs serve.py (scar 5)
  chan.onmessage = e => handleMsg(e.data);
}
function postMsg(type, data) { if (chan) chan.postMessage(Object.assign({ type }, data)); }

function handleMsg(msg) {
  switch (msg.type) {
    /* every message SETS state; the audience follows, never leads */
    case 'STEP': if (AUDIENCE) { advanced = msg.advanced; setPos(msg.m, msg.s, { silent: true }); } break;
    case 'CHECKPOINT': if (AUDIENCE) { completion = msg.completion; updateChrome(); } break;
    case 'ADVANCE': if (AUDIENCE) applyAdvance(msg.advanced, { silent: true }); break;
    case 'SCRIPT': if (AUDIENCE) { scriptWall = msg.scriptWall; updateScriptsInPlace(); } break;
    case 'WHITEBOARD': if (AUDIENCE) { whiteboards[msg.stepId] = msg.entries; updateWhiteboardInPlace(msg.stepId); } break;
    case 'POLL': if (AUDIENCE) { polls[msg.key] = msg.counts; updatePollInPlace(msg.key); } break;
    case 'ACTIVITY': if (AUDIENCE) { activity = { stepId: msg.stepId, minutes: msg.minutes, on: msg.on, started: Date.now() }; renderActivity(); } break;
    case 'COURSE': course = msg.course; store(K('course'), course); render(); break;
    case 'RESTART': if (AUDIENCE) resetSessionState(); break;
    case 'HELLO': if (!AUDIENCE) postMsg('SYNC', { pos, advanced, completion, whiteboards, polls, scriptWall, course, activity }); break;
    case 'SYNC': if (AUDIENCE) {
      advanced = msg.advanced; completion = msg.completion; whiteboards = msg.whiteboards;
      polls = msg.polls; scriptWall = msg.scriptWall; course = msg.course;
      activity = msg.activity || { on: false };
      setPos(msg.pos.m, msg.pos.s, { silent: true }); renderActivity();
    } break;
  }
}

/* ============ navigation and the gate ============ */
function setPos(m, s, opts) {
  opts = opts || {};
  logDeparture();
  pos = { m, s };
  if (!NO_PERSIST && !AUDIENCE) store(K('position'), pos);
  stepEntered = Date.now();
  render();
  if (!opts.silent && !AUDIENCE) postMsg('STEP', { m, s, advanced });
  pushState();
}
function nextAction() {
  /* the single path: drawer Next, edge chevrons, ArrowRight, swipe, and the remote all land here */
  if (AUDIENCE) return;
  const mod = curMod();
  if (pos.s === -1) { setPos(pos.m, 0); return; }                       // begin the module
  if (pos.s < mod.steps.length - 1) { setPos(pos.m, pos.s + 1); return; }

/* ============ cinematic opener: the ONLY canvas and rAF loop in the build ============ */
function maybePlayCinematic() {
  const mIdx = pos.m, mod = curMod();
  const media = (mod.opener || {}).media;
  const theme = THEMES[currentTheme] || {};
  const frames = media && (media.framesInline && media.framesInline.length
    ? media.framesInline
    : (media.framesDir && media.frameCount
        ? Array.from({ length: media.frameCount }, (_, i) => media.framesDir.replace(/\/$/, '') + '/frame_' + String(i + 1).padStart(4, '0') + '.jpg')
        : null));
  if (!frames || theme.plainOpener || REDUCED || openersPlayed[mIdx] || cineActive) return;   // reduced motion collapses to the arrival still
  openersPlayed[mIdx] = true;
  if (!NO_PERSIST) store(K('openers'), openersPlayed);
  cineActive = true;

  const wrap = document.createElement('div'); wrap.id = 'cine';
  wrap.setAttribute('role', 'img');
  wrap.setAttribute('aria-label', 'Opening film for ' + mod.opener.stageName);
  wrap.innerHTML = '<canvas></canvas><div class="cine-title">' + esc(mod.opener.stageName) + '</div>' +
    '<div class="cine-skip">click or any key to skip</div>';
  document.body.appendChild(wrap);
  const cv = wrap.querySelector('canvas'), ctx = cv.getContext('2d');

  /* dpr-capped backing store: a CSS-pixel canvas is blurry on retina and 4K projection
     (web-standards Mobile 3, scar 19); re-run sizing on resize */
  const size = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  size();
  const onResize = () => size();
  addEventListener('resize', onResize);

  const imgs = frames.map(src => { const im = new Image(); im.src = src; return im; });
  let finished = false;
  const draw = im => {
    if (!im || !im.naturalWidth) return;
    const r = cv.getBoundingClientRect();
    const scale = Math.max(r.width / im.naturalWidth, r.height / im.naturalHeight);
    const w = im.naturalWidth * scale, h = im.naturalHeight * scale;
    ctx.fillStyle = '#16181D'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.drawImage(im, (r.width - w) / 2, (r.height - h) / 2, w, h);
  };
  const finish = () => {
    if (finished) return; finished = true;
    removeEventListener('resize', onResize);
    removeEventListener('keydown', onKey, true);
    wrap.remove();
    cineActive = false;
  };
  const onKey = e => { e.stopPropagation(); finish(); };
  wrap.addEventListener('click', finish);
  addEventListener('keydown', onKey, true);
  /* decode ahead so first play is as smooth as replay */
  Promise.allSettled(imgs.map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve())).then(() => {
    const t0 = performance.now();
    const tick = now => {
      if (finished) return;
      const p = Math.min((now - t0) / (OPENER_SECONDS * 1000), 1);
      draw(imgs[Math.min(Math.floor(p * imgs.length), imgs.length - 1)]);
      if (p < 1) requestAnimationFrame(tick); else setTimeout(finish, 400);
    };
    requestAnimationFrame(tick);
  });
}

  else if (act === 'print') { buildPrintDoc(); window.print(); }

}

/* ============ restart ============ */

/* ============ edit mode (presenter surfaces only, never the audience) ============ */
function toggleEdit(force, tuck) {
  if (AUDIENCE) return;   // no affordance, no keypress, nothing
  editing = force != null ? force : !editing;
  document.body.classList.toggle('editing', editing);

function commitCourse() {
  course.programme.edited = new Date().toISOString();
  store(K('course'), course);
  postMsg('COURSE', { course });   // ONE broadcast per commit, zero mid-typing
  if (editing) renderEditbar();    // the sidebar tree and fields track every commit
  pushState();
}
function resolveEdit(path) {
  /* path grammar: "o|field", "o|objectives|N", "b|N|field", "b|N|left|field" */
  const parts = path.split('|');
  if (parts[0] === 'o') {
    const o = curMod().opener;
    if (parts[1] === 'objectives') return { obj: o.objectives, key: Number(parts[2]) };
    return { obj: o, key: parts[1] };
  }
  let target = curStep().blocks[Number(parts[1])];
  let rest = parts.slice(2);
  if (rest[0] === 'left' || rest[0] === 'right') { target = target[rest[0]]; rest = rest.slice(1); }
  return { obj: target, key: rest[0] };
}
function initEditDelegation() {
  const stage = $('#stage');
  stage.addEventListener('click', e => {
    if (!e.target || typeof e.target.closest !== 'function') return;   // non-Element targets happen (scar 16)
    const x = e.target.closest('.xchip');
    if (x && editing) {
      if (window.confirm('Remove this block?')) {
        curStep().blocks.splice(Number(x.getAttribute('data-x')), 1);
        commitCourse(); renderStep();
      }
      return;
    }
    if (e.target.closest('#addTile') && editing) { openTileMenu(e); return; }
    const media = e.target.closest('[data-media]');
    if (media && editing && !e.target.closest('[data-edit]')) {
      let url = '';
      try { url = window.prompt('Paste the media URL (YouTube, .mp4, image, or article):', '') || ''; } catch {}
      if (url) {
        const { obj } = resolveEdit(media.getAttribute('data-media'));
        obj.src = url;
        obj.kind = /youtube\.com|youtu\.be/.test(url) ? 'youtube' : /\.mp4(\?|$)/i.test(url) ? 'mp4' : /\.(png|jpe?g|webp|avif|gif|svg)(\?|$)/i.test(url) ? 'image' : 'article';
        commitCourse(); renderStep();
      }
      return;
    }
    const ed = e.target.closest('[data-edit]');
    if (ed && editing && !ed.isContentEditable) startInlineEdit(ed);
  });
  $('#editCollapseTab').addEventListener('click', () => document.body.classList.add('edit-tucked'));
  $('#editTab').addEventListener('click', () => document.body.classList.remove('edit-tucked'));
  document.querySelectorAll('.overlay [data-close]').forEach(b => b.addEventListener('click', () => b.closest('.overlay').classList.remove('open')));
}
function startInlineEdit(el) {
  const original = el.textContent;
  let cancelled = false;
  el.contentEditable = 'true';
  el.classList.add('editing-el');
  el.focus();
  try { const range = document.createRange(); range.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); } catch {}
  const onKey = e => {
    if (e.key === 'Escape') { cancelled = true; el.textContent = original; el.blur(); }
    e.stopPropagation();
  };
  const onBlur = () => {
    el.removeEventListener('keydown', onKey); el.removeEventListener('blur', onBlur);
    el.contentEditable = 'false'; el.classList.remove('editing-el');
    if (cancelled) return;
    const { obj, key } = resolveEdit(el.getAttribute('data-edit'));
    obj[key] = el.textContent;   // chrome lives on the tilewrap, so textContent stays clean (scar 9)
    commitCourse();              // blur commits: one broadcast, then done
  };
  el.addEventListener('keydown', onKey);
  el.addEventListener('blur', onBlur);
}

function editOp(op) {
  const steps = curMod().steps;
  if (op === 'up' && pos.s > 0) { [steps[pos.s - 1], steps[pos.s]] = [steps[pos.s], steps[pos.s - 1]]; commitCourse(); setPos(pos.m, pos.s - 1); }
  else if (op === 'dn' && pos.s > -1 && pos.s < steps.length - 1) { [steps[pos.s + 1], steps[pos.s]] = [steps[pos.s], steps[pos.s + 1]]; commitCourse(); setPos(pos.m, pos.s + 1); }
  else if (op === 'dup' && pos.s > -1) {
    const copy = JSON.parse(JSON.stringify(steps[pos.s])); copy.id = copy.id + '-copy' + Date.now().toString(36).slice(-4);
    steps.splice(pos.s + 1, 0, copy); commitCourse(); setPos(pos.m, pos.s + 1);
  }
  else if (op === 'del' && pos.s > -1 && steps.length > 1) {
    if (!window.confirm('Delete this step? Its coverage row is marked "removed by owner".')) return;
    const id = steps[pos.s].id;
    (course.coverage || []).forEach(row => { if (row.step === id) row.removed = 'removed by owner'; });
    steps.splice(pos.s, 1); commitCourse(); setPos(pos.m, Math.max(0, pos.s - 1));
  }
  else if (op === 'addstep') {
    const s = { id: 'new-' + Date.now().toString(36), segment: 'New step (owner-added)', presenterNotes: [{ say: '', do: '', ask: '', minutes: 0 }], blocks: [{ type: 'heading', text: 'New step' }] };
    steps.splice(pos.s + 1, 0, s); commitCourse(); setPos(pos.m, pos.s + 1);
  }
  else if (op === 'export') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(course, null, 2)], { type: 'application/json' }));
    a.download = 'course.json'; document.body.appendChild(a); a.click(); a.remove();
  }
  else if (op === 'import') { const f = $('#importFile'); if (f) f.click(); }
}

/* ============ keys, swipe, locks ============ */
function initKeys() {
  addEventListener('keydown', e => {
    const t = e.target;
    /* hotkeys never fire from inputs, textareas, selects, or contenteditable (scar 12) */
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (AUDIENCE) {
      /* the audience input lock is real; Tab is preserved for keyboard users */
      if (e.key !== 'Tab' && ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', ' ', 'Home', 'End'].includes(e.key)) e.preventDefault();
      return;
    }
    if (e.key === 'ArrowRight') nextAction();
    else if (e.key === 'ArrowLeft') back();
    else if (e.key === 'p' || e.key === 'P') { if (ROLE === 'solo') document.body.classList.toggle('drawer-open'); }
    else if (e.key === 'g' || e.key === 'G') toggleOverview();
    else if (e.key === 'e' || e.key === 'E') toggleEdit();
    else if (e.key === 'Escape') { toggleOverview(false); $('#rehearsalOv').classList.remove('open'); }
  });
  if (AUDIENCE) {
    addEventListener('wheel', e => e.preventDefault(), { passive: false });
    addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  }
  $('#nextBtn').addEventListener('click', nextAction);
  $('#prevBtn').addEventListener('click', back);
}
function initSwipe() {
  if (AUDIENCE) return;
  let startX = 0, startY = 0, active = false;
  const stage = $('#stage');
  stage.addEventListener('pointerdown', e => {
    if (!e.target || typeof e.target.closest !== 'function') return;   // scar 16
    if (e.target.closest('#drawer,#editbar,#overview,input,textarea,select,[contenteditable=true]')) return;
    active = true; startX = e.clientX; startY = e.clientY;
    try { stage.setPointerCapture(e.pointerId); } catch {}   // synthetic pointers throw (scar 11)
  });
  stage.addEventListener('pointerup', e => {
    if (!active) return; active = false;
    try { stage.releasePointerCapture(e.pointerId); } catch {}
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) { if (dx < 0) nextAction(); else back(); }   // 60px threshold, 50px drift guard
  });
}
function initGrip() {
  const grip = $('#grip'); if (!grip) return;
  let dragging = false, moved = false, startX = 0, startW = 0;
  grip.addEventListener('pointerdown', e => {
    dragging = true; moved = false; startX = e.clientX;
    startW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--drawerw')) || 470;
    try { grip.setPointerCapture(e.pointerId); } catch {}
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = startX - e.clientX;
    if (Math.abs(dx) > 4) moved = true;
    if (moved) setDrawerW(Math.min(Math.max(startW + dx, 380), innerWidth * 0.9));
  });
  grip.addEventListener('pointerup', e => {
    try { grip.releasePointerCapture(e.pointerId); } catch {}
    if (dragging && !moved) {
      /* click toggles normal 470 and wide (70vw capped at 920): the width SNAPS, it never tweens (scar 1) */
      const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--drawerw')) || 470;
      setDrawerW(cur < 600 ? Math.min(innerWidth * 0.7, 920) : 470);
    }
    dragging = false;
  });
}
function setDrawerW(px) {
  px = Math.round(px);
  document.documentElement.style.setProperty('--drawerw', px + 'px');   // plain px in the var (scar 1)
  store(K('drawerw'), px);
}

/* ============ stagecraft: wake lock, fullscreen, cursor ============ */
function initStagecraft() {
  const lock = async () => { try { if ('wakeLock' in navigator) wakeSentinel = await navigator.wakeLock.request('screen'); } catch {} };
  lock();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });   // re-acquire; the projector never sleeps mid-activity
  if (!AUDIENCE) return;
  const fsBtn = $('#fsBtn');
  if (document.documentElement.requestFullscreen) {
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', () => document.documentElement.requestFullscreen().catch(() => {}));
    document.addEventListener('fullscreenchange', () => { fsBtn.hidden = !!document.fullscreenElement; });
  }
  let cursorTimer = 0;
  const arm = () => {
    $('#app').classList.remove('cursor-hide');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => $('#app').classList.add('cursor-hide'), 3000);   // Keynote-grade: no parked cursor on the wall
  };
  addEventListener('mousemove', arm); arm();
}

/* ============ relay (serve.py): remote commands in, display state out ============ */
let relayLive = false;
function initRelay() {
  if (!PRESENTER_SURFACE || !HTTPISH) return;
  fetch('/netinfo').then(r => { if (!r.ok) throw 0; return r.json(); }).then(() => {
    relayLive = true;
    const es = new EventSource('/events');
    es.onmessage = e => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type !== 'REMOTE') return;
      /* commands land on the presenter's OWN gate path; authority never leaves this tab */
      if (msg.action === 'next') nextAction();
      else if (msg.action === 'back') back();
      else if (msg.action === 'checkpoint') doCheckpoint();
      else if (msg.action === 'advance') advanceModule();
      else if (msg.action === 'activity') toggleActivity();
    };
    pushState();
  }).catch(() => {});   // no serve.py: solo and dual still work, the drawer row says so
}
function pushState() {
  if (!relayLive || !PRESENTER_SURFACE) return;
  const mod = curMod();
  const frontier = pos.m === advanced && pos.s === mod.steps.length - 1 && pos.m < course.modules.length - 1;
  fetch('/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
    type: 'STATE',
    meta: mod.module + (pos.s === -1 ? ' · opener' : ' · step ' + (pos.s + 1) + ' of ' + mod.steps.length),
    head: pos.s === -1 ? mod.opener.stageName : ((curStep().blocks.find(b => b.type === 'heading') || {}).text || curStep().segment),
    checkpointDone: !!completion[pos.m],
    canAdvance: !!completion[pos.m] && frontier,
    activityOn: !!activity.on
  }) }).catch(() => {});
}

/* ============ the remote role ============ */
function initRemote() {
  document.title = course.programme.title + ' | Remote';
  const send = action => fetch('/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'REMOTE', action }) }).catch(() => {});
  $('#rNext').addEventListener('click', () => send('next'));
  $('#rBack').addEventListener('click', () => send('back'));
  $('#rCheckpoint').addEventListener('click', () => send('checkpoint'));
  $('#rAdvance').addEventListener('click', () => send('advance'));
  $('#rActivity').addEventListener('click', () => send('activity'));
  const lock = async () => { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch {} };
  lock();
  if (!HTTPISH) { $('#rConn').textContent = 'needs serve.py'; return; }
  const es = new EventSource('/events');
  /* the dot and the text are separate nodes: state updates never replace the dot's element (scar 17) */
  es.onopen = () => { $('#rDot').classList.add('live'); $('#rConn').textContent = 'connected'; };
  es.onerror = () => { $('#rDot').classList.remove('live'); $('#rConn').textContent = 'reconnecting'; };
  es.onmessage = e => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type !== 'STATE') return;
    $('#rMeta').textContent = msg.meta || '';
    $('#rHead').textContent = msg.head || '';
    $('#rAdvance').disabled = !msg.canAdvance;   // Advance stays dead until the checkpoint is done
    $('#rCheckpoint').textContent = msg.checkpointDone ? 'Checkpoint done' : 'Checkpoint';
    $('#rActivity').textContent = msg.activityOn ? 'End activity' : 'Activity';
  };
}

boot();
})();
</script>
